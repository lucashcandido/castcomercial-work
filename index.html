<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cast Entrada">
<title>Cast Comercial – Entrada</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Time recording at the entrance of a parking lot (hourly customers).
   One device per parking lot. Each stay: plate + time in; the X ends it and shows the time parked.
   Data: own private GitHub repository, one file per parking lot and month (<lot>/<YYYY-MM>.json).
   The token on this device can only reach that repository - never the customer data of app.castcomercial.com. */
:root{--bg:#f3f4f7;--card:#fff;--text:#171a21;--muted:#667085;--line:#e2e5eb;--accent:#1d4ed8;--accent-soft:#e3ebff;--in:#15803d;--in-soft:#dcf5e4;--out:#c62828;--out-soft:#fde4e4;--warn:#b45309;--warn-soft:#fdeed3}
@media (prefers-color-scheme: dark){:root{--bg:#0f1218;--card:#191d26;--text:#eef0f4;--muted:#98a2b3;--line:#2a303c;--accent:#6b93ff;--accent-soft:#1d2a4d;--in:#4ade80;--in-soft:#12301f;--out:#f87171;--out-soft:#3a1a1a;--warn:#fbbf24;--warn-soft:#3a2a0d}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
main{max-width:720px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.top img{width:44px;height:44px;border-radius:50%}
.top h1{font-size:20px;margin:0;line-height:1.15}
.top .sub{display:block;font-size:14px;color:var(--muted);font-weight:500}
.top .clock{margin-left:auto;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.top h1{min-width:0} .top .sub{overflow-wrap:anywhere}
@media (max-width:400px){.top{gap:8px} .top img{width:38px;height:38px} .top h1{font-size:17px} .top .clock{font-size:20px} .top .icon{width:40px;height:40px}}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.new{display:flex;gap:10px}
.daypick{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;margin-bottom:12px}
.dbtn{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.dbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.daypick button,.daypick .dbtn{min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;font-size:16px;font-weight:700;padding:4px 8px;cursor:pointer;min-width:0}
.daypick .on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.day{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.day .dn{flex:1;min-width:0;font-weight:650} .day .dn small{display:block;color:var(--muted);font-weight:500;font-size:13.5px}
.day .da{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.day.miss .da{color:var(--muted);font-weight:600;font-size:15px}
.day.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.new input.name{text-transform:none;letter-spacing:0}
.plate.nm{font-family:inherit;letter-spacing:0;border-style:dashed}
.veh{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px}
.veh button{min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;font-size:16px;font-weight:700;cursor:pointer;padding:4px}
.veh button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vtag{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:3px}
@media (max-width:420px){.veh button{font-size:14px}}
.new input{flex:1;min-width:0;font-size:30px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-variant-numeric:tabular-nums}
.new input:focus{outline:none;border-color:var(--accent)}
.btn{border:0;border-radius:14px;padding:0 22px;min-height:60px;font-size:20px;font-weight:700;cursor:pointer;background:var(--card);border:1px solid var(--line)}
.btn.go{background:var(--in);color:#fff;border-color:var(--in)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{background:var(--out);color:#fff;border-color:var(--out)}
.btn.wide{width:100%}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.msg.err{background:var(--out-soft);color:var(--out)} .msg.ok{background:var(--in-soft);color:var(--in)} .msg.warn{background:var(--warn-soft);color:var(--warn)}
h2{font-size:17px;margin:22px 4px 8px;display:flex;align-items:baseline;gap:8px}
h2 .n{color:var(--muted);font-weight:600}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 16px}
.plate{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:22px;letter-spacing:.04em;border:2px solid var(--text);border-radius:8px;padding:2px 10px;white-space:nowrap}
.meta{flex:1;min-width:0;color:var(--muted);font-size:15px;line-height:1.3}
.meta b{display:block;color:var(--text);font-size:24px;font-variant-numeric:tabular-nums}
.x{width:64px;height:64px;border-radius:14px;border:2px solid var(--out);background:var(--out-soft);color:var(--out);font-size:34px;font-weight:700;line-height:1;cursor:pointer;flex:none}
.done .meta b{font-size:18px}
.empty{color:var(--muted);padding:14px 16px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--in)} .pill.wait i{background:var(--warn)} .pill.err i{background:var(--out)}
.ov{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto}
.sheet h3{margin:0 0 12px;font-size:20px}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:18px;margin:12px 0 16px}
.sum span{color:var(--muted)} .sum b{text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.price{text-align:center;font-size:30px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.price-calc{text-align:center;color:var(--muted);font-size:15px;margin-bottom:14px}
.meta .pr{display:block;font-weight:700;color:var(--text)}
.qrbig{text-align:center} .qrbig h3{font-size:22px;margin:0 0 6px} .qrbig p{margin:0 0 12px;color:var(--muted)}
.qrbox{display:inline-block;background:#fff;padding:10px;border-radius:14px;border:1px solid var(--line);margin:0 0 14px} .qrbox svg{display:block;width:min(78vw,360px);height:auto}
.row2{display:flex;gap:10px} .row2 .btn{flex:1}
.btn:disabled{opacity:.45;cursor:default}
.pay{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:0 0 8px}
.pay button{min-height:54px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:4px;line-height:1.15}
.pay button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pay-lbl{font-weight:650;font-size:15px;margin:0 0 6px}
#payOther{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:17px;margin:0 0 8px}
#payMsg{min-height:20px;color:var(--out);font-size:14px;font-weight:600;text-align:center;margin-bottom:8px}
.field{margin-bottom:14px} .field label,.lbl{display:block;font-weight:650;margin-bottom:6px;font-size:15px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:17px}
.lots{display:grid;gap:8px}
.lots label{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-weight:600;cursor:pointer}
.lots label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.field .lots input{width:22px;height:22px;flex:none;margin:0;padding:0;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#171a21;color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:14px;align-items:center;z-index:60;width:max-content;max-width:calc(100% - 32px);font-size:16px}
.toast button{background:none;border:0;color:#9db8ff;font-weight:700;cursor:pointer;font-size:16px}
details summary{cursor:pointer;color:var(--muted);margin:22px 4px 8px;font-weight:600}
</style>
</head>
<body>
<main>
  <!-- set-up (once per device, by the owners) -->
  <section id="setup" hidden>
    <div class="top"><img src="logo.png" alt=""><h1>Cast Comercial<span class="sub">Configuración del dispositivo (solo encargados)</span></h1></div>
    <div class="card">
      <div class="field"><span class="lbl">Estacionamiento de este dispositivo</span><div class="lots" id="sLots"></div></div>
      <div class="field"><label for="sCode">Código de las entradas</label><input id="sCode" class="codein" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX"><p class="hint">Está en app.castcomercial.com → Ajustes → Entradas. Más fácil: escaneá ahí el QR del estacionamiento con la cámara de este dispositivo.</p></div>
      <button class="btn primary wide" id="sGo" type="button">Preparar dispositivo</button>
      <button class="btn wide" id="sBack" type="button" hidden style="margin-top:10px">Volver sin cambios</button>
      <div id="sMsg"></div>
    </div>
  </section>

  <!-- the screen at the entrance -->
  <section id="work" hidden>
    <div class="top">
      <img src="logo.png" alt="">
      <h1 id="lotName">—<span class="sub"><span class="pill" id="sync"><i></i><span>—</span></span></span></h1>
      <div class="clock" id="clock">--:--</div>
      <button class="icon" id="regQr" type="button" aria-label="QR de registro para clientes" title="QR de registro para clientes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 17h3v3h-3z"/></svg></button>
      <button class="icon" id="gear" type="button" aria-label="Configuración" title="Configuración"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <form class="card" id="dayForm" autocomplete="off" novalidate>
      <span class="lbl">Día</span>
      <div class="daypick"><button type="button" data-day="0">Hoy</button><button type="button" data-day="1">Ayer</button><label class="dbtn" id="dayOther"><span id="dayOtherTxt">Otro día</span><input type="date" id="dayDate" aria-label="Otro día"></label></div>
      <label class="lbl" for="amt" id="amtLbl">Recaudación del día</label>
      <div class="new"><input id="amt" inputmode="decimal" placeholder="$ 0" enterkeyhint="done" autocomplete="off"><button class="btn go" id="amtGo" type="submit">Guardar</button></div>
      <div id="dayMsg"></div>
    </form>
    <h2>Últimos días <span class="n" id="monthSum"></span></h2>
    <ul class="list" id="dayList"></ul>
  </section>
</main>
<div id="layer"></div>
<script>
(function(){
'use strict';
var $ = function(s, el){ return (el || document).querySelector(s); };
var LOTS = [['lot1', 'Lope de Vega'], ['lot2', 'Bolivia'], ['lot3', 'Condarco']];
var KEY = { cfg:'cw.cfg.v1', data:'cw.data.v1', dirty:'cw.dirty.v1' };
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); };
var pad = function(n){ return (n < 10 ? '0' : '') + n; };
var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };
var hm = function(ts){ var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
var ym = function(ts){ var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
var dayKey = function(ts){ var d = new Date(ts); return ym(ts) + '-' + pad(d.getDate()); };
function dur(ms){ var m = Math.max(0, Math.floor(ms / 60000)), h = Math.floor(m / 60); return h + ':' + pad(m % 60); }
function durText(ms){ var m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60); m = m % 60; return (h ? h + ' h ' : '') + m + ' min'; }
function plate(v){
  var s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), m;
  if((m = /^([A-Z]{2})(\d{3})([A-Z]{2})$/.exec(s))) return m[1] + ' ' + m[2] + ' ' + m[3];
  if((m = /^([A-Z]{3})(\d{3})$/.exec(s))) return m[1] + ' ' + m[2];
  if((m = /^([A-Z])(\d{3})([A-Z]{3})$/.exec(s))) return m[1] + m[2] + ' ' + m[3];
  if((m = /^(\d{3})([A-Z]{3})$/.exec(s))) return m[1] + ' ' + m[2];
  if((m = /^([A-Z])(\d{1,7})$/.exec(s))) return m[1] + ' ' + m[2];             /* before 1995: province letter + number (B 1234567) */
  return String(v || '').toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();   /* anything else (diplomatic, trailers, ...): as typed */
}
/* Every Argentine plate is accepted: current (AB 123 CD), 1995-2016 (ABC 123), motorcycles (A123 BCD, 123 ABC), the old provincial
   ones and special plates. Only obvious typos are stopped: fewer than 2 or more than 10 letters/numbers. */
var money = function(n){ return '$ ' + Math.round(n).toLocaleString('es-AR'); };
/* amounts as people type them in Argentina: 150000, 150.000, 150.000,50 */
function parseAmt(v){
  var s = String(v || '').replace(/[^\d.,]/g, '');
  if(!s) return NaN;
  if(s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return Math.round(parseFloat(s) * 100) / 100;
}
var key = function(p){ return String(p || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); };

var cfg = store.get(KEY.cfg, null);              /* {repo, token, lot, name, code} */
if(cfg && !cfg.code) cfg = null;                  /* set up the old way (token typed in): ask for the code once */
var data = store.get(KEY.data, {});              /* id -> {id, k, in, out, t, del} */
var dirty = store.get(KEY.dirty, {});            /* months with local changes not yet saved */

/* ---------- screens ---------- */
function show(){
  $('#setup').hidden = !!cfg; $('#work').hidden = !cfg;
  if(!cfg){ drawSetup(); return; }
  $('#lotName').firstChild.nodeValue = cfg.name;
  document.title = 'Entrada – ' + cfg.name;
  render();
}
function drawSetup(lot){
  $('#sLots').innerHTML = LOTS.map(function(l){ return '<label><input type="radio" name="sl" value="' + l[0] + '"' + ((lot || (cfg && cfg.lot)) === l[0] ? ' checked' : '') + '>' + esc(l[1]) + '</label>'; }).join('');
  $('#sBack').hidden = !cfg;
}
/* ---------- access code: the owners' app publishes the token encrypted with this code ----------
   work-access.json = AES-GCM(PBKDF2(code)) of {repo, token}. Without the code the file is useless; the token is never typed here. */
var ACCESS_URL = 'https://api.github.com/repos/lucashcandido/Angel-parkinglot/contents/work-access.json';
var cleanCode = function(c){ return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); };
var showCode = function(c){ return cleanCode(c).slice(0, 12).replace(/(.{4})(?=.)/g, '$1-'); };
var b64bytes = function(s){ var x = atob(String(s)), b = new Uint8Array(x.length); for(var i = 0; i < x.length; i++) b[i] = x.charCodeAt(i); return b; };
async function openAccess(code){
  var r = await fetch(ACCESS_URL, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
  if(r.status === 404) throw new Error('none');
  if(!r.ok) throw new Error('net');
  var j = await r.json(), blob = JSON.parse(b64d(j.content));
  if(!blob || blob.v !== 1 || !(blob.it >= 100000 && blob.it <= 5000000)) throw new Error('format');
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(cleanCode(code)), 'PBKDF2', false, ['deriveKey']);
  var k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64bytes(blob.salt), iterations: blob.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  var plain;
  try{ plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64bytes(blob.iv) }, k, b64bytes(blob.ct)); }catch(e){ throw new Error('code'); }
  var conf = JSON.parse(new TextDecoder().decode(plain));
  if(!conf || typeof conf.token !== 'string' || !/^[\w.-]+\/[\w.-]+$/.test(conf.repo || '')) throw new Error('format');
  return conf;
}
$('#sCode').addEventListener('input', function(){ var c = cleanCode(this.value).slice(0, 12); this.value = c.replace(/(.{4})(?=.)/g, '$1-'); });
$('#sCode').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('#sGo').click(); });
$('#sBack').onclick = function(){ show(); };
async function setUp(lotId, code){
  var msg = function(t, c){ $('#sMsg').innerHTML = '<div class="msg ' + (c || 'err') + '">' + esc(t) + '</div>'; };
  if(!lotId) return msg('Elegí el estacionamiento.');
  if(cleanCode(code).length !== 12) return msg('Escribí el código completo (12 letras y números).');
  msg('Preparando…', 'warn'); $('#sGo').disabled = true;
  try{
    var conf = await openAccess(code);
    var r = await fetch('https://api.github.com/repos/' + conf.repo, { headers: { Authorization: 'Bearer ' + conf.token, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if(r.status === 401) throw new Error('expired');
    if(!r.ok) throw new Error('net');
  }catch(e){
    $('#sGo').disabled = false;
    return msg(e.message === 'code' ? 'Código incorrecto.' : e.message === 'none' ? 'Las entradas todavía no están configuradas en app.castcomercial.com (Ajustes → Entradas).' : e.message === 'expired' ? 'El token de las entradas venció: el administrador tiene que cambiarlo en app.castcomercial.com.' : 'Sin conexión o error. Probá de nuevo.');
  }
  $('#sGo').disabled = false;
  var name = LOTS.filter(function(l){ return l[0] === lotId; })[0][1];
  var changedLot = cfg && cfg.lot !== lotId;
  cfg = { repo: conf.repo, token: conf.token, lot: lotId, name: name, code: cleanCode(code) };
  store.set(KEY.cfg, cfg);
  if(changedLot){ data = {}; dirty = {}; store.set(KEY.data, data); store.set(KEY.dirty, dirty); }
  $('#sCode').value = ''; $('#sMsg').innerHTML = '';
  show(); syncNow();
}
$('#sGo').onclick = function(){ var lot = document.querySelector('input[name=sl]:checked'); setUp(lot && lot.value, $('#sCode').value); };
/* the QR code in the owners' app: work.castcomercial.com/#c=CODE&l=lot1 sets the device up in one step */
(function(){
  var h = new URLSearchParams(location.hash.slice(1)), c = h.get('c'), l = h.get('l');
  if(!c) return;
  history.replaceState(null, '', location.pathname + location.search);     /* the code does not stay in the address bar */
  if(cfg && cfg.code === cleanCode(c) && cfg.lot === l) return;
  if(cfg && Object.keys(dirty).length) return;        /* never throw away entries that are not saved yet */
  setTimeout(function(){
    $('#setup').hidden = false; $('#work').hidden = true; drawSetup(LOTS.some(function(x){ return x[0] === l; }) ? l : '');
    $('#sCode').value = showCode(c);
    if(LOTS.some(function(x){ return x[0] === l; })) setUp(l, c);
  });
})();
/* QR code for new customers: they scan it with their phone and land on the sign-up form, with this parking lot chosen */
var REG_URL = 'https://reg.castcomercial.com/';
var qrReady = null;
var loadQr = function(){ return qrReady || (qrReady = new Promise(function(ok, no){ if(window.qrcode) return ok(); var sc = document.createElement('script'); sc.src = 'qrcode.js'; sc.onload = ok; sc.onerror = function(){ qrReady = null; no(); }; document.head.appendChild(sc); })); };
function qrSvg(text){
  var q = qrcode(0, 'M'); q.addData(text); q.make();
  var n = q.getModuleCount(), m = 4, all = n + 2 * m, d = '';
  for(var r = 0; r < n; r++) for(var c = 0; c < n; c++) if(q.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + all + ' ' + all + '" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="' + all + '" height="' + all + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}
$('#regQr').onclick = async function(){
  try{ await loadQr(); }catch(e){ toast('No se pudo cargar el código QR. Revisá la conexión.'); return; }
  var url = REG_URL + '?l=' + encodeURIComponent(cfg.name);
  modal('<div class="qrbig"><h3>Registro de clientes</h3><p>Escaneá el código con la cámara de tu celular.</p><div class="qrbox" id="regQrBox">' + qrSvg(url) + '</div><button class="btn primary wide" data-close type="button">Listo</button></div>');
};
$('#gear').onclick = function(){
  modal('<h3>Configuración</h3><div class="field"><label for="pinIn">Código de las entradas</label><input id="pinIn" class="codein" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX"></div><div id="pinMsg"></div><div class="row2"><button class="btn" data-close type="button">Cancelar</button><button class="btn primary" id="pinGo" type="button">Abrir</button></div>', function(el){
    var inp = $('#pinIn', el);
    inp.oninput = function(){ inp.value = showCode(inp.value); };
    var go = function(){
      if(cleanCode(inp.value) !== cfg.code){ $('#pinMsg', el).innerHTML = '<div class="msg err">Código incorrecto.</div>'; return; }
      close(el);
      $('#setup').hidden = false; $('#work').hidden = true; drawSetup(); $('#sCode').value = showCode(cfg.code);
    };
    $('#pinGo', el).onclick = go; inp.onkeydown = function(e){ if(e.key === 'Enter') go(); };
    setTimeout(function(){ inp.focus(); }, 50);
  });
};

/* ---------- daily revenue ----------
   One amount per parking lot and day: {id:'day-<lot>-<date>', k:'day', d:'YYYY-MM-DD', a: amount, in: noon of that day, t}.
   It lives in the month file of that day, next to older single stays; the newest change wins on every device. */
var iso = function(dt){ return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); };
var todayIso = function(){ return iso(new Date()); };
var dayIso = function(back){ var d = new Date(); d.setDate(d.getDate() - back); return iso(d); };
var noon = function(d){ var p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12).getTime(); };
var dayName = function(d){ var n = new Date(noon(d)).toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'short' }).replace(/\./g, ''); return n.charAt(0).toUpperCase() + n.slice(1); };
var dayRec = function(d){ var r = data['day-' + cfg.lot + '-' + d]; return r && !r.del ? r : null; };
var selDay = todayIso(), lastToday = selDay;
function touch(s){ s.t = Date.now(); data[s.id] = s; dirty[ym(s.in)] = true; store.set(KEY.data, data); store.set(KEY.dirty, dirty); render(); syncSoon(); }
function pickDay(d){
  if(d > todayIso()) d = todayIso();
  selDay = d; $('#dayMsg').innerHTML = '';
  var r = dayRec(d);
  $('#amt').value = r ? Math.round(r.a).toLocaleString('es-AR') : '';
  render();
}
$('#dayForm').addEventListener('click', function(e){ var b = e.target.closest('[data-day]'); if(b) pickDay(dayIso(+b.dataset.day)); });
$('#dayDate').addEventListener('change', function(){ if(this.value) pickDay(this.value); });
$('#amt').addEventListener('input', function(){ $('#dayMsg').innerHTML = ''; });
$('#amt').addEventListener('blur', function(){ var a = parseAmt(this.value); if(a >= 0) this.value = a.toLocaleString('es-AR'); });
$('#dayList').addEventListener('click', function(e){ var li = e.target.closest('[data-d]'); if(li){ pickDay(li.dataset.d); $('#amt').focus(); window.scrollTo(0, 0); } });
$('#dayForm').onsubmit = function(e){
  e.preventDefault();
  var a = parseAmt($('#amt').value), d = selDay, m = $('#dayMsg'), old = dayRec(d);
  if(!(a >= 0)){ m.innerHTML = '<div class="msg err">Escribí el monto del día.</div>'; $('#amt').focus(); return; }
  var save = function(){
    var id = 'day-' + cfg.lot + '-' + d, prev = data[id] ? JSON.parse(JSON.stringify(data[id])) : null;
    var rec = { id: id, k: 'day', d: d, a: a, in: noon(d) };
    if(old && old.a !== a) rec.h = (old.h || []).concat([{ a: old.a, t: old.t }]);      /* corrected: earlier amounts stay visible to the owners */
    touch(rec);
    $('#amt').blur(); m.innerHTML = '';
    toast(money(a) + ' guardado para ' + (d === todayIso() ? 'hoy' : dayName(d)) + '.', 'Deshacer', function(){ if(prev) touch(prev); else touch({ id: id, k: 'day', d: d, a: a, in: noon(d), del: true }); pickDay(d); });
  };
  if(old && old.a !== a){
    modal('<h3>¿Reemplazar?</h3><p>Para ' + esc(dayName(d)) + ' ya está cargado <b>' + money(old.a) + '</b>.</p><p>¿Cambiarlo por <b>' + money(a) + '</b>?</p><div class="row2"><button class="btn" data-close type="button">Cancelar</button><button class="btn primary" id="repGo" type="button">Reemplazar</button></div>',
      function(el){ $('#repGo', el).onclick = function(){ close(el); save(); }; });
    return;
  }
  save();
};

/* ---------- drawing ---------- */
function render(){
  if(!cfg) return;
  if(lastToday !== todayIso()){ if(selDay === lastToday) selDay = todayIso(); lastToday = todayIso(); }       /* the page stayed open past midnight */
  var now = Date.now(), t = todayIso(), y = dayIso(1), r = dayRec(selDay);
  [].forEach.call(document.querySelectorAll('.daypick [data-day]'), function(b){ b.classList.toggle('on', dayIso(+b.dataset.day) === selDay); });
  var other = selDay !== t && selDay !== y, di = $('#dayDate');
  di.max = t; di.value = selDay; $('#dayOther').classList.toggle('on', other);
  $('#dayOtherTxt').textContent = other ? new Date(noon(selDay)).toLocaleDateString('es-AR', { day:'numeric', month:'short' }).replace('.', '') : 'Otro día';
  $('#amtLbl').textContent = 'Recaudación ' + (selDay === t ? 'de hoy' : selDay === y ? 'de ayer' : 'del ' + dayName(selDay));
  $('#amtGo').textContent = r ? 'Corregir' : 'Guardar';
  /* the last 14 days, missing days included so nothing is forgotten */
  var rows = [], cur = ym(now), sum = 0;
  Object.keys(data).forEach(function(k){ var x = data[k]; if(x && x.k === 'day' && !x.del && x.d.slice(0, 7) === cur) sum += x.a || 0; });
  for(var i = 0; i < 14; i++){
    var d = dayIso(i), x = dayRec(d);
    rows.push('<li class="day' + (x ? '' : ' miss') + (d === selDay ? ' sel' : '') + '" data-d="' + d + '"><div class="dn">' + esc(dayName(d)) + (i === 0 ? ' · hoy' : '') + (x ? '<small>cargado a las ' + hm(x.t) + '</small>' : '') + '</div><div class="da">' + (x ? money(x.a) : 'sin cargar') + '</div></li>');
  }
  $('#dayList').innerHTML = rows.join('');
  $('#monthSum').textContent = '· este mes ' + money(sum);
  $('#clock').textContent = hm(now);
}
setInterval(render, 20000);

/* ---------- small windows ---------- */
function modal(html, init){
  var ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  ov.addEventListener('click', function(e){ if(e.target === ov || e.target.closest('[data-close]')) close(ov); });
  $('#layer').appendChild(ov); if(init) init(ov); return ov;
}
function close(el){ if(el && el.parentNode) el.parentNode.removeChild(el); }
document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ var o = $('#layer .ov:last-child'); if(o) close(o); } });
var toastT = 0;
function toast(text, act, fn){
  var old = $('.toast'); if(old) close(old);
  var t = document.createElement('div'); t.className = 'toast'; t.innerHTML = '<span>' + esc(text) + '</span>' + (act ? '<button type="button">' + esc(act) + '</button>' : '');
  if(act) t.querySelector('button').onclick = function(){ close(t); fn(); };
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(function(){ close(t); }, 6000);
}

/* ---------- saving to GitHub ---------- */
var sync = { busy: false, timer: 0, state: 'wait' };
function setSync(st, text){ sync.state = st; var p = $('#sync'); p.className = 'pill ' + st; p.lastChild.textContent = text; }
function syncSoon(){ clearTimeout(sync.timer); setSync('wait', 'Guardando…'); sync.timer = setTimeout(syncNow, 1500); }
function api(path, opt){
  opt = opt || {}; opt.headers = Object.assign({ Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' }, opt.headers || {}); opt.cache = 'no-store';
  return fetch('https://api.github.com/repos/' + cfg.repo + '/contents/' + path, opt);
}
var b64e = function(s){ var b = new TextEncoder().encode(s), x = ''; for(var i = 0; i < b.length; i++) x += String.fromCharCode(b[i]); return btoa(x); };
var b64d = function(s){ var x = atob(s.replace(/\s/g, '')), b = new Uint8Array(x.length); for(var i = 0; i < x.length; i++) b[i] = x.charCodeAt(i); return new TextDecoder().decode(b); };
function merge(remote){        /* newer change wins, per stay */
  var changed = false;
  Object.keys(remote || {}).forEach(function(id){ var r = remote[id], l = data[id]; if(r && (!l || (r.t || 0) > (l.t || 0))){ data[id] = r; changed = true; } });
  return changed;
}
async function loadMonth(m){
  var r = await api(cfg.lot + '/' + m + '.json');
  if(r.status === 404) return { sha: null, s: {} };
  if(!r.ok) throw new Error('http ' + r.status);
  var j = await r.json(), o = JSON.parse(b64d(j.content) || '{}');
  return { sha: j.sha, s: o.s || {} };
}
async function saveMonth(m){
  for(var tries = 0; tries < 3; tries++){
    var cur = await loadMonth(m); merge(cur.s);
    var mine = {}; Object.keys(data).forEach(function(id){ if(ym(data[id].in) === m) mine[id] = data[id]; });
    var body = { message: cfg.name + ' ' + m + ' ' + new Date().toISOString(), content: b64e(JSON.stringify({ v: 1, lot: cfg.lot, name: cfg.name, month: m, s: mine }, null, 0)) };
    if(cur.sha) body.sha = cur.sha;
    var r = await api(cfg.lot + '/' + m + '.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if(r.ok) return;
    if(r.status !== 409 && r.status !== 422) throw new Error('http ' + r.status);
  }
  throw new Error('conflict');
}
async function syncNow(){
  if(!cfg || sync.busy) return;
  sync.busy = true; clearTimeout(sync.timer);
  try{
    var now = Date.now(), months = {}; months[ym(now)] = 1; months[ym(now - 15 * 864e5)] = 1;     /* this month and, early in a month, the last one (the list shows 14 days) */
    Object.keys(dirty).forEach(function(m){ months[m] = 1; });
    for(var m in months){
      if(dirty[m]){ await saveMonth(m); delete dirty[m]; store.set(KEY.dirty, dirty); }
      else { var cur = await loadMonth(m); merge(cur.s); }
    }
    store.set(KEY.data, data);
    setSync('ok', 'Guardado ' + hm(Date.now()));
  }catch(e){
    if(/http 401/.test(e.message)){
      var fresh = null; try{ fresh = await openAccess(cfg.code); }catch(x){}
      if(fresh && fresh.token !== cfg.token){ cfg.token = fresh.token; cfg.repo = fresh.repo; store.set(KEY.cfg, cfg); sync.busy = false; return syncNow(); }   /* the owners replaced the token */
      setSync('err', 'Token vencido: avisar al encargado');
    }
    else setSync(Object.keys(dirty).length ? 'wait' : 'ok', Object.keys(dirty).length ? 'Sin conexión – se guarda después' : 'Sin conexión');
  }
  sync.busy = false; render();
}
setInterval(function(){ if(cfg) syncNow(); }, 60000);
addEventListener('online', function(){ syncNow(); });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible'){ render(); syncNow(); keepAwake(); } });

/* the screen stays on at the entrance */
var lock = null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', function(){ lock = null; }); } }catch(e){} }

show();
if(cfg){ setSync(Object.keys(dirty).length ? 'wait' : 'ok', '…'); syncNow(); keepAwake(); }
window.__cw = { get data(){ return data; }, get cfg(){ return cfg; }, pickDay: pickDay, syncNow: syncNow };
})();
</script>
